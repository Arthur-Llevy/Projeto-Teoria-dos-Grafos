<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Novo curso | Organizador de Horários</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css', v=5) }}"
    />
  </head>
  <body class="registration-page">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Organizador de Horários, início">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none">
            <rect
              x="2.5"
              y="3.5"
              width="15"
              height="14"
              rx="2"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="M6 2.5v3M14 2.5v3M3 7.5h14M6 10.5h2M11 10.5h2M6 14h2M11 14h2"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span class="brand-copy">
          <strong>Organizador de Horários</strong>
          <small>Cadastro de curso</small>
        </span>
      </a>
      <a class="new-discipline-link" href="{{ url_for('courses.courses') }}">
        Ver cursos
      </a>
    </header>

    <main class="registration-main">
      <a class="registration-back" href="{{ url_for('courses.courses') }}">
        ← Voltar para os cursos
      </a>
      <div class="registration-heading">
        <h1>Novo curso</h1>
        <p>Preencha os dados para cadastrar um curso.</p>
      </div>

      <form class="registration-form" method="post" action="{{ url_for('courses.courses') }}">
        {% if errors %}
        <ul class="registration-errors" role="alert">
          {% for error in errors %}
          <li>{{ error }}</li>
          {% endfor %}
        </ul>
        {% endif %}

        <div class="registration-fields">
          <label class="registration-field">
            Nome do curso
            <input
              name="nome"
              type="text"
              maxlength="100"
              value="{{ values.get('nome', '') }}"
              autocomplete="organization-title"
              required
            />
          </label>
          <label class="registration-field">
            Descrição
            <input
              name="descricao"
              type="text"
              maxlength="100"
              value="{{ values.get('descricao', '') }}"
            />
          </label>
        </div>

        <div class="registration-actions">
          <a class="registration-cancel" href="{{ url_for('courses.courses') }}">
            Cancelar
          </a>
          <button class="registration-submit" type="submit">
            Cadastrar curso
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
